
services:
  redis:
    image: redis:7-alpine
    container_name: real_estate_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  db:
    image: postgres:15-alpine
    container_name: real_estate_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: real_estate_backend
    restart: always
    ports:
      - "127.0.0.1:5000:5000"

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      FLASK_DEBUG: ${FLASK_DEBUG}
      SECRET_KEY: ${SECRET_KEY}
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-redis://redis:6379/1}
      CACHE_TYPE: ${CACHE_TYPE:-RedisCache}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://redis:6379/0}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_ANALYST_EMAIL: ${SEED_ANALYST_EMAIL}
      SEED_ANALYST_PASSWORD: ${SEED_ANALYST_PASSWORD}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      MAX_MAP_PINS: ${MAX_MAP_PINS:-5000}

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: real_estate_frontend
    restart: always
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend

  cron:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: real_estate_cron
    restart: always
    command: >
      bash -c "printenv | grep -E '^(DATABASE_URL|FLASK_APP|SECRET_KEY|RATELIMIT_STORAGE_URI|CACHE_TYPE|CACHE_REDIS_URL|JWT_EXPIRY_HOURS)=' >> /etc/environment && cron -f"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      FLASK_APP: run.py
      SECRET_KEY: ${SECRET_KEY}
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-redis://redis:6379/1}
      CACHE_TYPE: ${CACHE_TYPE:-RedisCache}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://redis:6379/0}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
volumes:
  postgres_data: